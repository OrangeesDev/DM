<?xml version="1.0" encoding="UTF-8"?>
<!-- made with html to svg. open this file directly in a browser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>DM Multi-CDN Launcher (1–10000)</title>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" title="DM Multi-CDN Launcher (1–10000)" style="display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; web-share; accelerometer; gyroscope" allowfullscreen="true" srcdoc="&lt;!DOCTYPE html&gt;&#13;&#10;&lt;html lang=&quot;en&quot;&gt;&#13;&#10;&lt;head&gt;&#13;&#10;  &lt;meta charset=&quot;UTF-8&quot;&gt;&#13;&#10;  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;&#13;&#10;  &lt;title&gt;DM Multi-CDN Launcher (1–10000)&lt;/title&gt;&#13;&#10;  &lt;style&gt;&#13;&#10;    :root {&#13;&#10;      --bg: #0c0c0c;&#13;&#10;      --card: #161616;&#13;&#10;      --border: #2a2a2a;&#13;&#10;      --accent: #ff9f43;&#13;&#10;      --text: #e8e8e8;&#13;&#10;      --muted: #888;&#13;&#10;    }&#13;&#10;    * { box-sizing: border-box; margin: 0; padding: 0; }&#13;&#10;    body {&#13;&#10;      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;&#13;&#10;      background: var(--bg);&#13;&#10;      color: var(--text);&#13;&#10;      padding: 24px 16px 60px;&#13;&#10;      line-height: 1.5;&#13;&#10;    }&#13;&#10;    .container { max-width: 1200px; margin: 0 auto; }&#13;&#10;    h1 {&#13;&#10;      font-size: 1.7rem;&#13;&#10;      color: var(--accent);&#13;&#10;      margin-bottom: 4px;&#13;&#10;    }&#13;&#10;    .subtitle {&#13;&#10;      color: var(--muted);&#13;&#10;      margin-bottom: 22px;&#13;&#10;      font-size: 0.92rem;&#13;&#10;    }&#13;&#10;    .subtitle a { color: var(--accent); }&#13;&#10;    .controls {&#13;&#10;      display: flex;&#13;&#10;      flex-wrap: wrap;&#13;&#10;      gap: 10px;&#13;&#10;      margin-bottom: 18px;&#13;&#10;      align-items: center;&#13;&#10;      background: var(--card);&#13;&#10;      padding: 14px;&#13;&#10;      border-radius: 10px;&#13;&#10;      border: 1px solid var(--border);&#13;&#10;    }&#13;&#10;    .controls label {&#13;&#10;      font-size: 0.85rem;&#13;&#10;      color: var(--muted);&#13;&#10;    }&#13;&#10;    input, select, button {&#13;&#10;      background: #111;&#13;&#10;      border: 1px solid var(--border);&#13;&#10;      color: var(--text);&#13;&#10;      padding: 7px 11px;&#13;&#10;      border-radius: 6px;&#13;&#10;      font-size: 0.9rem;&#13;&#10;    }&#13;&#10;    input:focus, select:focus {&#13;&#10;      border-color: var(--accent);&#13;&#10;      outline: none;&#13;&#10;    }&#13;&#10;    button {&#13;&#10;      background: var(--accent);&#13;&#10;      color: #111;&#13;&#10;      font-weight: 600;&#13;&#10;      border: none;&#13;&#10;      cursor: pointer;&#13;&#10;    }&#13;&#10;    button:hover { filter: brightness(1.08); }&#13;&#10;    button.secondary {&#13;&#10;      background: #333;&#13;&#10;      color: var(--text);&#13;&#10;    }&#13;&#10;    .info {&#13;&#10;      font-size: 0.85rem;&#13;&#10;      color: var(--muted);&#13;&#10;      margin-bottom: 14px;&#13;&#10;    }&#13;&#10;    .grid {&#13;&#10;      display: grid;&#13;&#10;      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));&#13;&#10;      gap: 12px;&#13;&#10;    }&#13;&#10;    .card {&#13;&#10;      background: var(--card);&#13;&#10;      border: 1px solid var(--border);&#13;&#10;      border-radius: 9px;&#13;&#10;      padding: 12px;&#13;&#10;      display: flex;&#13;&#10;      flex-direction: column;&#13;&#10;      gap: 8px;&#13;&#10;    }&#13;&#10;    .card-title {&#13;&#10;      font-weight: 600;&#13;&#10;      font-size: 1rem;&#13;&#10;      color: var(--accent);&#13;&#10;    }&#13;&#10;    .cdn-links {&#13;&#10;      display: flex;&#13;&#10;      flex-wrap: wrap;&#13;&#10;      gap: 5px;&#13;&#10;    }&#13;&#10;    .cdn-links a {&#13;&#10;      font-size: 0.72rem;&#13;&#10;      padding: 3px 7px;&#13;&#10;      border-radius: 4px;&#13;&#10;      text-decoration: none;&#13;&#10;      color: #111;&#13;&#10;      font-weight: 500;&#13;&#10;    }&#13;&#10;    .cdn-links a:hover { opacity: 0.85; }&#13;&#10;    .jsdelivr { background: #ff9f43; }&#13;&#10;    .fastly   { background: #e74c3c; }&#13;&#10;    .gcore    { background: #3498db; }&#13;&#10;    .quantil  { background: #9b59b6; }&#13;&#10;    .github   { background: #2ecc71; }&#13;&#10;    .preview {&#13;&#10;      width: 100%;&#13;&#10;      height: 70px;&#13;&#10;      object-fit: contain;&#13;&#10;      background: #111;&#13;&#10;      border-radius: 5px;&#13;&#10;      border: 1px solid var(--border);&#13;&#10;    }&#13;&#10;    .pagination {&#13;&#10;      display: flex;&#13;&#10;      gap: 8px;&#13;&#10;      margin: 20px 0 10px;&#13;&#10;      flex-wrap: wrap;&#13;&#10;      align-items: center;&#13;&#10;    }&#13;&#10;    .pagination button {&#13;&#10;      min-width: 40px;&#13;&#10;    }&#13;&#10;    .footer {&#13;&#10;      margin-top: 36px;&#13;&#10;      padding-top: 16px;&#13;&#10;      border-top: 1px solid var(--border);&#13;&#10;      font-size: 0.82rem;&#13;&#10;      color: var(--muted);&#13;&#10;      line-height: 1.6;&#13;&#10;    }&#13;&#10;    .footer code {&#13;&#10;      background: #222;&#13;&#10;      padding: 1px 5px;&#13;&#10;      border-radius: 3px;&#13;&#10;      font-size: 0.78rem;&#13;&#10;    }&#13;&#10;  &lt;/style&gt;&#13;&#10;&lt;/head&gt;&#13;&#10;&lt;body&gt;&#13;&#10;  &lt;div class=&quot;container&quot;&gt;&#13;&#10;    &lt;h1&gt;🦆 DM Multi-CDN Launcher&lt;/h1&gt;&#13;&#10;    &lt;p class=&quot;subtitle&quot;&gt;&#13;&#10;      Dm1.svg → Dm10000.svg &amp;nbsp;·&amp;nbsp;&#13;&#10;      &lt;a href=&quot;https://github.com/OrangeesDev/DM&quot; target=&quot;_blank&quot;&gt;OrangeesDev/DM&lt;/a&gt;&#13;&#10;      &amp;nbsp;·&amp;nbsp; Pure client-side · No API&#13;&#10;    &lt;/p&gt;&#13;&#10;&#13;&#10;    &lt;div class=&quot;controls&quot;&gt;&#13;&#10;      &lt;label&gt;Jump to #&lt;/label&gt;&#13;&#10;      &lt;input type=&quot;number&quot; id=&quot;jumpInput&quot; min=&quot;1&quot; max=&quot;10000&quot; placeholder=&quot;e.g. 420&quot; style=&quot;width:90px&quot;&gt;&#13;&#10;      &lt;button onclick=&quot;jumpTo()&quot;&gt;Go&lt;/button&gt;&#13;&#10;&#13;&#10;      &lt;label style=&quot;margin-left:8px&quot;&gt;CDN&lt;/label&gt;&#13;&#10;      &lt;select id=&quot;cdnFilter&quot;&gt;&#13;&#10;        &lt;option value=&quot;all&quot;&gt;All CDNs&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;jsdelivr&quot;&gt;jsDelivr&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;fastly&quot;&gt;Fastly&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;gcore&quot;&gt;Gcore&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;quantil&quot;&gt;Quantil&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;github&quot;&gt;GitHub Raw&lt;/option&gt;&#13;&#10;      &lt;/select&gt;&#13;&#10;&#13;&#10;      &lt;label&gt;Preview&lt;/label&gt;&#13;&#10;      &lt;select id=&quot;previewMode&quot;&gt;&#13;&#10;        &lt;option value=&quot;off&quot;&gt;Off&lt;/option&gt;&#13;&#10;        &lt;option value=&quot;on&quot;&gt;On&lt;/option&gt;&#13;&#10;      &lt;/select&gt;&#13;&#10;&#13;&#10;      &lt;button class=&quot;secondary&quot; onclick=&quot;openRange()&quot;&gt;Open current page&lt;/button&gt;&#13;&#10;    &lt;/div&gt;&#13;&#10;&#13;&#10;    &lt;div class=&quot;info&quot; id=&quot;info&quot;&gt;&lt;/div&gt;&#13;&#10;&#13;&#10;    &lt;div class=&quot;pagination&quot; id=&quot;pagination&quot;&gt;&lt;/div&gt;&#13;&#10;    &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;&lt;/div&gt;&#13;&#10;    &lt;div class=&quot;pagination&quot; id=&quot;paginationBottom&quot;&gt;&lt;/div&gt;&#13;&#10;&#13;&#10;    &lt;div class=&quot;footer&quot;&gt;&#13;&#10;      &lt;strong&gt;CDN bases:&lt;/strong&gt;&lt;br&gt;&#13;&#10;      • &lt;code&gt;https://cdn.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#13;&#10;      • &lt;code&gt;https://fastly.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#13;&#10;      • &lt;code&gt;https://gcore.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#13;&#10;      • &lt;code&gt;https://quantil.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#13;&#10;      • &lt;code&gt;https://raw.githubusercontent.com/OrangeesDev/DM/main/&lt;/code&gt;&#13;&#10;    &lt;/div&gt;&#13;&#10;  &lt;/div&gt;&#13;&#10;&#13;&#10;  &lt;script&gt;&#13;&#10;    // ====== Built-in range (no API) ======&#13;&#10;    const TOTAL = 10000;&#13;&#10;    const PER_PAGE = 50;&#13;&#10;&#13;&#10;    const cdns = {&#13;&#10;      jsdelivr: { name: &quot;jsDelivr&quot;, class: &quot;jsdelivr&quot;, base: &quot;https://cdn.jsdelivr.net/gh/OrangeesDev/DM@main/&quot; },&#13;&#10;      fastly:   { name: &quot;Fastly&quot;,   class: &quot;fastly&quot;,   base: &quot;https://fastly.jsdelivr.net/gh/OrangeesDev/DM@main/&quot; },&#13;&#10;      gcore:    { name: &quot;Gcore&quot;,    class: &quot;gcore&quot;,    base: &quot;https://gcore.jsdelivr.net/gh/OrangeesDev/DM@main/&quot; },&#13;&#10;      quantil:  { name: &quot;Quantil&quot;,  class: &quot;quantil&quot;,  base: &quot;https://quantil.jsdelivr.net/gh/OrangeesDev/DM@main/&quot; },&#13;&#10;      github:   { name: &quot;GitHub&quot;,   class: &quot;github&quot;,   base: &quot;https://raw.githubusercontent.com/OrangeesDev/DM/main/&quot; }&#13;&#10;    };&#13;&#10;&#13;&#10;    let currentPage = 1;&#13;&#10;&#13;&#10;    const grid = document.getElementById(&quot;grid&quot;);&#13;&#10;    const info = document.getElementById(&quot;info&quot;);&#13;&#10;    const cdnFilter = document.getElementById(&quot;cdnFilter&quot;);&#13;&#10;    const previewMode = document.getElementById(&quot;previewMode&quot;);&#13;&#10;    const pagination = document.getElementById(&quot;pagination&quot;);&#13;&#10;    const paginationBottom = document.getElementById(&quot;paginationBottom&quot;);&#13;&#10;&#13;&#10;    function getTotalPages() {&#13;&#10;      return Math.ceil(TOTAL / PER_PAGE);&#13;&#10;    }&#13;&#10;&#13;&#10;    function renderPagination(container) {&#13;&#10;      const totalPages = getTotalPages();&#13;&#10;      container.innerHTML = &quot;&quot;;&#13;&#10;&#13;&#10;      const prev = document.createElement(&quot;button&quot;);&#13;&#10;      prev.textContent = &quot;← Prev&quot;;&#13;&#10;      prev.disabled = currentPage === 1;&#13;&#10;      prev.onclick = () =&gt; { currentPage--; render(); };&#13;&#10;      container.appendChild(prev);&#13;&#10;&#13;&#10;      // page numbers (smart)&#13;&#10;      const start = Math.max(1, currentPage - 3);&#13;&#10;      const end = Math.min(totalPages, currentPage + 3);&#13;&#10;&#13;&#10;      if (start &gt; 1) {&#13;&#10;        const b = document.createElement(&quot;button&quot;);&#13;&#10;        b.textContent = &quot;1&quot;;&#13;&#10;        b.onclick = () =&gt; { currentPage = 1; render(); };&#13;&#10;        container.appendChild(b);&#13;&#10;        if (start &gt; 2) {&#13;&#10;          const dots = document.createElement(&quot;span&quot;);&#13;&#10;          dots.textContent = &quot;…&quot;;&#13;&#10;          dots.style.color = &quot;var(--muted)&quot;;&#13;&#10;          container.appendChild(dots);&#13;&#10;        }&#13;&#10;      }&#13;&#10;&#13;&#10;      for (let i = start; i &lt;= end; i++) {&#13;&#10;        const b = document.createElement(&quot;button&quot;);&#13;&#10;        b.textContent = i;&#13;&#10;        if (i === currentPage) b.style.background = &quot;#ff9f43&quot;;&#13;&#10;        b.onclick = () =&gt; { currentPage = i; render(); };&#13;&#10;        container.appendChild(b);&#13;&#10;      }&#13;&#10;&#13;&#10;      if (end &lt; totalPages) {&#13;&#10;        if (end &lt; totalPages - 1) {&#13;&#10;          const dots = document.createElement(&quot;span&quot;);&#13;&#10;          dots.textContent = &quot;…&quot;;&#13;&#10;          dots.style.color = &quot;var(--muted)&quot;;&#13;&#10;          container.appendChild(dots);&#13;&#10;        }&#13;&#10;        const b = document.createElement(&quot;button&quot;);&#13;&#10;        b.textContent = totalPages;&#13;&#10;        b.onclick = () =&gt; { currentPage = totalPages; render(); };&#13;&#10;        container.appendChild(b);&#13;&#10;      }&#13;&#10;&#13;&#10;      const next = document.createElement(&quot;button&quot;);&#13;&#10;      next.textContent = &quot;Next →&quot;;&#13;&#10;      next.disabled = currentPage === totalPages;&#13;&#10;      next.onclick = () =&gt; { currentPage++; render(); };&#13;&#10;      container.appendChild(next);&#13;&#10;    }&#13;&#10;&#13;&#10;    function render() {&#13;&#10;      const filter = cdnFilter.value;&#13;&#10;      const showPreview = previewMode.value === &quot;on&quot;;&#13;&#10;      const startNum = (currentPage - 1) * PER_PAGE + 1;&#13;&#10;      const endNum = Math.min(currentPage * PER_PAGE, TOTAL);&#13;&#10;&#13;&#10;      info.textContent = `Showing Dm${startNum}.svg – Dm${endNum}.svg  (${TOTAL} total)`;&#13;&#10;&#13;&#10;      grid.innerHTML = &quot;&quot;;&#13;&#10;&#13;&#10;      for (let i = startNum; i &lt;= endNum; i++) {&#13;&#10;        const file = `Dm${i}.svg`;&#13;&#10;        const card = document.createElement(&quot;div&quot;);&#13;&#10;        card.className = &quot;card&quot;;&#13;&#10;&#13;&#10;        const title = document.createElement(&quot;div&quot;);&#13;&#10;        title.className = &quot;card-title&quot;;&#13;&#10;        title.textContent = file;&#13;&#10;        card.appendChild(title);&#13;&#10;&#13;&#10;        if (showPreview) {&#13;&#10;          const img = document.createElement(&quot;img&quot;);&#13;&#10;          img.className = &quot;preview&quot;;&#13;&#10;          img.src = cdns.jsdelivr.base + file;&#13;&#10;          img.alt = file;&#13;&#10;          img.loading = &quot;lazy&quot;;&#13;&#10;          card.appendChild(img);&#13;&#10;        }&#13;&#10;&#13;&#10;        const links = document.createElement(&quot;div&quot;);&#13;&#10;        links.className = &quot;cdn-links&quot;;&#13;&#10;&#13;&#10;        Object.keys(cdns).forEach(key =&gt; {&#13;&#10;          if (filter !== &quot;all&quot; &amp;&amp; filter !== key) return;&#13;&#10;          const cdn = cdns[key];&#13;&#10;          const a = document.createElement(&quot;a&quot;);&#13;&#10;          a.href = cdn.base + file;&#13;&#10;          a.target = &quot;_blank&quot;;&#13;&#10;          a.rel = &quot;noopener&quot;;&#13;&#10;          a.className = cdn.class;&#13;&#10;          a.textContent = cdn.name;&#13;&#10;          a.title = cdn.base + file;&#13;&#10;          links.appendChild(a);&#13;&#10;        });&#13;&#10;&#13;&#10;        card.appendChild(links);&#13;&#10;        grid.appendChild(card);&#13;&#10;      }&#13;&#10;&#13;&#10;      renderPagination(pagination);&#13;&#10;      renderPagination(paginationBottom);&#13;&#10;    }&#13;&#10;&#13;&#10;    function jumpTo() {&#13;&#10;      const num = parseInt(document.getElementById(&quot;jumpInput&quot;).value);&#13;&#10;      if (isNaN(num) || num &lt; 1 || num &gt; TOTAL) {&#13;&#10;        alert(&quot;Enter a number between 1 and 10000&quot;);&#13;&#10;        return;&#13;&#10;      }&#13;&#10;      currentPage = Math.ceil(num / PER_PAGE);&#13;&#10;      render();&#13;&#10;      // highlight the card&#13;&#10;      setTimeout(() =&gt; {&#13;&#10;        const cards = document.querySelectorAll(&quot;.card-title&quot;);&#13;&#10;        cards.forEach(c =&gt; {&#13;&#10;          if (c.textContent === `Dm${num}.svg`) {&#13;&#10;            c.parentElement.style.borderColor = &quot;#ff9f43&quot;;&#13;&#10;            c.parentElement.scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;center&quot; });&#13;&#10;          }&#13;&#10;        });&#13;&#10;      }, 50);&#13;&#10;    }&#13;&#10;&#13;&#10;    function openRange() {&#13;&#10;      const filter = cdnFilter.value === &quot;all&quot; ? &quot;jsdelivr&quot; : cdnFilter.value;&#13;&#10;      const startNum = (currentPage - 1) * PER_PAGE + 1;&#13;&#10;      const endNum = Math.min(currentPage * PER_PAGE, TOTAL);&#13;&#10;      if (!confirm(`Open Dm${startNum} → Dm${endNum} using ${filter}?`)) return;&#13;&#10;      for (let i = startNum; i &lt;= endNum; i++) {&#13;&#10;        window.open(cdns[filter].base + `Dm${i}.svg`, &quot;_blank&quot;);&#13;&#10;      }&#13;&#10;    }&#13;&#10;&#13;&#10;    // Enter key on jump&#13;&#10;    document.getElementById(&quot;jumpInput&quot;).addEventListener(&quot;keydown&quot;, e =&gt; {&#13;&#10;      if (e.key === &quot;Enter&quot;) jumpTo();&#13;&#10;    });&#13;&#10;&#13;&#10;    cdnFilter.addEventListener(&quot;change&quot;, render);&#13;&#10;    previewMode.addEventListener(&quot;change&quot;, render);&#13;&#10;&#13;&#10;    // Initial load&#13;&#10;    render();&#13;&#10;  &lt;/script&gt;&#13;&#10;&lt;/body&gt;&#13;&#10;&lt;/html&gt;"></iframe>
  </foreignObject>
</svg>

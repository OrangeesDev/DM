<?xml version="1.0" encoding="UTF-8"?>
<!-- made with html to svg. open this file directly in a browser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>DM Multi-CDN Launcher</title>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" title="DM Multi-CDN Launcher" style="display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; web-share; accelerometer; gyroscope" allowfullscreen="true" srcdoc="&lt;!DOCTYPE html&gt;&#10;&lt;html lang=&quot;en&quot;&gt;&#10;&lt;head&gt;&#10;  &lt;meta charset=&quot;UTF-8&quot;&gt;&#10;  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;&#10;  &lt;title&gt;DM Multi-CDN Launcher&lt;/title&gt;&#10;  &lt;style&gt;&#10;    :root {&#10;      --bg: #0c0c0c;&#10;      --card: #161616;&#10;      --border: #2a2a2a;&#10;      --accent: #ff9f43;&#10;      --text: #e8e8e8;&#10;      --muted: #888;&#10;    }&#10;    * { box-sizing: border-box; margin: 0; padding: 0; }&#10;    body {&#10;      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;&#10;      background: var(--bg);&#10;      color: var(--text);&#10;      padding: 30px 16px 60px;&#10;      line-height: 1.5;&#10;    }&#10;    .container { max-width: 1200px; margin: 0 auto; }&#10;    h1 {&#10;      font-size: 1.8rem;&#10;      color: var(--accent);&#10;      margin-bottom: 6px;&#10;    }&#10;    .subtitle {&#10;      color: var(--muted);&#10;      margin-bottom: 28px;&#10;      font-size: 0.95rem;&#10;    }&#10;    .subtitle a { color: var(--accent); }&#10;    .controls {&#10;      display: flex;&#10;      flex-wrap: wrap;&#10;      gap: 10px;&#10;      margin-bottom: 24px;&#10;      align-items: center;&#10;    }&#10;    .controls label {&#10;      font-size: 0.85rem;&#10;      color: var(--muted);&#10;      margin-right: 4px;&#10;    }&#10;    select, button {&#10;      background: var(--card);&#10;      border: 1px solid var(--border);&#10;      color: var(--text);&#10;      padding: 8px 12px;&#10;      border-radius: 6px;&#10;      font-size: 0.9rem;&#10;      cursor: pointer;&#10;    }&#10;    select:focus, button:hover {&#10;      border-color: var(--accent);&#10;      outline: none;&#10;    }&#10;    button {&#10;      background: var(--accent);&#10;      color: #111;&#10;      font-weight: 600;&#10;      border: none;&#10;    }&#10;    button:hover { filter: brightness(1.1); }&#10;    .grid {&#10;      display: grid;&#10;      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));&#10;      gap: 14px;&#10;    }&#10;    .card {&#10;      background: var(--card);&#10;      border: 1px solid var(--border);&#10;      border-radius: 10px;&#10;      padding: 14px;&#10;      display: flex;&#10;      flex-direction: column;&#10;      gap: 10px;&#10;    }&#10;    .card-title {&#10;      font-weight: 600;&#10;      font-size: 1.05rem;&#10;      color: var(--accent);&#10;    }&#10;    .cdn-links {&#10;      display: flex;&#10;      flex-wrap: wrap;&#10;      gap: 6px;&#10;    }&#10;    .cdn-links a {&#10;      font-size: 0.75rem;&#10;      padding: 4px 8px;&#10;      border-radius: 4px;&#10;      text-decoration: none;&#10;      color: #111;&#10;      font-weight: 500;&#10;      transition: transform 0.1s;&#10;    }&#10;    .cdn-links a:hover { transform: scale(1.05); }&#10;    .jsdelivr   { background: #ff9f43; }&#10;    .fastly     { background: #e74c3c; }&#10;    .gcore      { background: #3498db; }&#10;    .quantil    { background: #9b59b6; }&#10;    .github     { background: #2ecc71; }&#10;    .preview {&#10;      width: 100%;&#10;      height: 80px;&#10;      object-fit: contain;&#10;      background: #111;&#10;      border-radius: 6px;&#10;      border: 1px solid var(--border);&#10;    }&#10;    .footer {&#10;      margin-top: 40px;&#10;      padding-top: 20px;&#10;      border-top: 1px solid var(--border);&#10;      font-size: 0.85rem;&#10;      color: var(--muted);&#10;    }&#10;    .footer code {&#10;      background: #222;&#10;      padding: 2px 5px;&#10;      border-radius: 3px;&#10;      font-size: 0.8rem;&#10;    }&#10;  &lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;div class=&quot;container&quot;&gt;&#10;    &lt;h1&gt;🦆 DM Multi-CDN Launcher&lt;/h1&gt;&#10;    &lt;p class=&quot;subtitle&quot;&gt;&#10;      All 100 files from &#10;      &lt;a href=&quot;https://github.com/OrangeesDev/DM&quot; target=&quot;_blank&quot;&gt;OrangeesDev/DM&lt;/a&gt;&#10;      · Pure client-side · No API&#10;    &lt;/p&gt;&#10;&#10;    &lt;div class=&quot;controls&quot;&gt;&#10;      &lt;label&gt;Show CDN:&lt;/label&gt;&#10;      &lt;select id=&quot;cdnFilter&quot;&gt;&#10;        &lt;option value=&quot;all&quot;&gt;All CDNs&lt;/option&gt;&#10;        &lt;option value=&quot;jsdelivr&quot;&gt;jsDelivr only&lt;/option&gt;&#10;        &lt;option value=&quot;fastly&quot;&gt;Fastly only&lt;/option&gt;&#10;        &lt;option value=&quot;gcore&quot;&gt;Gcore only&lt;/option&gt;&#10;        &lt;option value=&quot;quantil&quot;&gt;Quantil only&lt;/option&gt;&#10;        &lt;option value=&quot;github&quot;&gt;GitHub Raw only&lt;/option&gt;&#10;      &lt;/select&gt;&#10;&#10;      &lt;label&gt;Preview:&lt;/label&gt;&#10;      &lt;select id=&quot;previewMode&quot;&gt;&#10;        &lt;option value=&quot;off&quot;&gt;Off&lt;/option&gt;&#10;        &lt;option value=&quot;on&quot;&gt;Show thumbnails&lt;/option&gt;&#10;      &lt;/select&gt;&#10;&#10;      &lt;button onclick=&quot;openAll('jsdelivr')&quot;&gt;Open all (jsDelivr)&lt;/button&gt;&#10;    &lt;/div&gt;&#10;&#10;    &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;&lt;/div&gt;&#10;&#10;    &lt;div class=&quot;footer&quot;&gt;&#10;      &lt;strong&gt;CDN bases used:&lt;/strong&gt;&lt;br&gt;&#10;      • &lt;code&gt;https://cdn.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#10;      • &lt;code&gt;https://fastly.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#10;      • &lt;code&gt;https://gcore.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#10;      • &lt;code&gt;https://quantil.jsdelivr.net/gh/OrangeesDev/DM@main/&lt;/code&gt;&lt;br&gt;&#10;      • &lt;code&gt;https://raw.githubusercontent.com/OrangeesDev/DM/main/&lt;/code&gt;&#10;    &lt;/div&gt;&#10;  &lt;/div&gt;&#10;&#10;  &lt;script&gt;&#10;    // ====== Built-in file list (no API) ======&#10;    const files = [];&#10;    for (let i = 1; i &lt;= 100; i++) {&#10;      files.push(`Dm${i}.svg`);&#10;    }&#10;&#10;    // ====== CDN providers ======&#10;    const cdns = {&#10;      jsdelivr: {&#10;        name: &quot;jsDelivr&quot;,&#10;        class: &quot;jsdelivr&quot;,&#10;        base: &quot;https://cdn.jsdelivr.net/gh/OrangeesDev/DM@main/&quot;&#10;      },&#10;      fastly: {&#10;        name: &quot;Fastly&quot;,&#10;        class: &quot;fastly&quot;,&#10;        base: &quot;https://fastly.jsdelivr.net/gh/OrangeesDev/DM@main/&quot;&#10;      },&#10;      gcore: {&#10;        name: &quot;Gcore&quot;,&#10;        class: &quot;gcore&quot;,&#10;        base: &quot;https://gcore.jsdelivr.net/gh/OrangeesDev/DM@main/&quot;&#10;      },&#10;      quantil: {&#10;        name: &quot;Quantil&quot;,&#10;        class: &quot;quantil&quot;,&#10;        base: &quot;https://quantil.jsdelivr.net/gh/OrangeesDev/DM@main/&quot;&#10;      },&#10;      github: {&#10;        name: &quot;GitHub&quot;,&#10;        class: &quot;github&quot;,&#10;        base: &quot;https://raw.githubusercontent.com/OrangeesDev/DM/main/&quot;&#10;      }&#10;    };&#10;&#10;    const grid = document.getElementById(&quot;grid&quot;);&#10;    const cdnFilter = document.getElementById(&quot;cdnFilter&quot;);&#10;    const previewMode = document.getElementById(&quot;previewMode&quot;);&#10;&#10;    function render() {&#10;      const filter = cdnFilter.value;&#10;      const showPreview = previewMode.value === &quot;on&quot;;&#10;&#10;      grid.innerHTML = &quot;&quot;;&#10;&#10;      files.forEach(file =&gt; {&#10;        const card = document.createElement(&quot;div&quot;);&#10;        card.className = &quot;card&quot;;&#10;&#10;        // Title&#10;        const title = document.createElement(&quot;div&quot;);&#10;        title.className = &quot;card-title&quot;;&#10;        title.textContent = file;&#10;        card.appendChild(title);&#10;&#10;        // Optional preview (uses jsDelivr)&#10;        if (showPreview) {&#10;          const img = document.createElement(&quot;img&quot;);&#10;          img.className = &quot;preview&quot;;&#10;          img.src = cdns.jsdelivr.base + file;&#10;          img.alt = file;&#10;          img.loading = &quot;lazy&quot;;&#10;          card.appendChild(img);&#10;        }&#10;&#10;        // CDN links&#10;        const links = document.createElement(&quot;div&quot;);&#10;        links.className = &quot;cdn-links&quot;;&#10;&#10;        Object.keys(cdns).forEach(key =&gt; {&#10;          if (filter !== &quot;all&quot; &amp;&amp; filter !== key) return;&#10;&#10;          const cdn = cdns[key];&#10;          const a = document.createElement(&quot;a&quot;);&#10;          a.href = cdn.base + file;&#10;          a.target = &quot;_blank&quot;;&#10;          a.rel = &quot;noopener&quot;;&#10;          a.className = cdn.class;&#10;          a.textContent = cdn.name;&#10;          a.title = `${cdn.name}: ${cdn.base}${file}`;&#10;          links.appendChild(a);&#10;        });&#10;&#10;        card.appendChild(links);&#10;        grid.appendChild(card);&#10;      });&#10;    }&#10;&#10;    // Open all files with a specific CDN&#10;    function openAll(provider) {&#10;      if (!confirm(`Open all 100 files using ${provider}?`)) return;&#10;      files.forEach(file =&gt; {&#10;        window.open(cdns[provider].base + file, &quot;_blank&quot;);&#10;      });&#10;    }&#10;&#10;    // Event listeners&#10;    cdnFilter.addEventListener(&quot;change&quot;, render);&#10;    previewMode.addEventListener(&quot;change&quot;, render);&#10;&#10;    // Initial render&#10;    render();&#10;  &lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></iframe>
  </foreignObject>
</svg>
